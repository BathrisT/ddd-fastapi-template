[alembic]
# `%(here)s` — каталог самого этого файла. Не `migrations`: относительный путь
# alembic разворачивает от ТЕКУЩЕГО каталога, а не от ini, и всё, что зовёт
# alembic не из корня репозитория (сторож из хука, тест из IDE, скрипт с
# `-C`), молча смотрит в несуществующий каталог ревизий. Пустой каталог
# ревизий — это не ошибка, это ноль голов и бодрое «ОК».
script_location = %(here)s/migrations
# По той же причине: отсюда `migrations/env.py` берёт `import app`, и точка,
# означающая текущий каталог, даёт ImportError при запуске не из корня.
prepend_sys_path = %(here)s
version_path_separator = os
# Реальный URL приходит из окружения: `migrations/env.py` берёт ALEMBIC_DB_URL,
# а без него — Settings. Строка ниже нужна alembic'у как заглушка и в проде не
# используется; пароля настоящей базы здесь быть не должно.
sqlalchemy.url = postgresql+asyncpg://postgres:secret@localhost:5432/app

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
