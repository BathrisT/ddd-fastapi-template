[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# Реальный URL приходит из окружения: `migrations/env.py` берёт ALEMBIC_DB_URL,
# а без него — Settings. Строка ниже нужна alembic'у как заглушка и в проде не
# используется; пароля настоящей базы здесь быть не должно.
sqlalchemy.url = postgresql+asyncpg://postgres:secret@localhost:5432/app

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
