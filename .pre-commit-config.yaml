repos:
  - repo: local
    hooks:
      - id: precommit
        name: precommit
        entry: make precommit
        language: system
        pass_filenames: false
        types: [python]
      - id: layers
        name: DDD layer check (tach)
        entry: make layers
        language: system
        pass_filenames: false
        types: [python]
